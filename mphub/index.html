<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>MP Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCFAF7;--card:#FFFFFF;--sand:#F4F0EA;--ink:#211C17;--soft:#544E48;--muted:#928B83;--line:#ECE7DE;--accent:#C4724A;--accent-dk:#AB5E38;--green:#3E9B6B;--green-bg:#E6F4EC;--shadow:0 1px 10px rgba(33,28,23,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171412;--card:#211D1A;--sand:#2B2622;--ink:#F3EEE8;--soft:#CFC7BE;--muted:#958C83;--line:#38312B;--accent:#D98A61;--accent-dk:#E69B73;--green:#6CC495;--green-bg:#1F3328;--shadow:none}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;min-height:100vh}
h1,h2{font-family:'DM Serif Display',serif;font-weight:400}
button,input{font:inherit;color:inherit}
input{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.head h1{font-size:1.7rem;flex:1}.head h1 span{color:var(--accent)}
.date{color:var(--muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.92rem;cursor:pointer;background:var(--sand);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-dk)}
.btn.good{background:var(--green);color:#fff}
.btn.small{padding:6px 12px;font-size:.82rem;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.progress .txt{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.bar{height:8px;background:var(--sand);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.step.done{background:var(--green-bg);border-color:transparent}
.step.done .num{background:var(--green);color:#fff}
.step.done .title{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:1.02rem}
.tip{color:var(--soft);font-size:.86rem;margin-top:2px}
.when{color:var(--green);font-size:.8rem;font-weight:600;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:24px}
.apps h2{grid-column:1/-1;font-size:1.2rem}
.apps a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:600;text-decoration:none;color:var(--ink);font-size:.9rem}
.apps a:hover{border-color:var(--accent)}
.sec{font-weight:700;color:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
details.edit{margin-top:28px;color:var(--soft);font-size:.9rem}
details.edit summary{cursor:pointer}
.editrow{display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .box{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal .box h2{font-size:1.3rem;margin-bottom:6px}
.modal .box p{color:var(--soft);margin-bottom:18px}
.modal .acts{justify-content:center}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
#lock h1{font-size:2rem}#lock h1 span{color:var(--accent)}
#lock .err{color:#C94848;font-size:.88rem;min-height:1.2em}
#lock label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:.88rem;color:var(--soft)}
#lock label input{width:auto}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="lock">
  <form id="lockForm">
    <h1>MP <span>Hub</span></h1>
    <input type="text" name="username" autocomplete="username" value="Miriam" hidden>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <label><input type="checkbox" id="remember" checked> Keep me signed in</label>
    <button class="btn primary" type="submit">Open</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="head"><h1>MP <span>Hub</span></h1><button class="btn small ghost" data-a="lock">Lock</button></div>
    <div class="date" id="date"></div>
    <div class="tabs"><button data-a="tab" data-v="today">Today</button><button data-a="tab" data-v="onb">Onboarding</button></div>
    <div id="main"></div>
  </div>
</div>

<div id="modal" class="modal" hidden><div class="box"><h2 id="mTitle"></h2><p id="mText"></p><div class="acts"><button class="btn ghost" data-a="mNo">Not yet</button><button class="btn good" data-a="mYes">Yes, done ✓</button></div></div></div>

<script>
(function(){
'use strict';
/* Only a PBKDF2 hash of the password is stored here — never the password itself. */
const PW_HASH='b489c8c8a39b3d4be4d5418fa1591aa6af01f6d9bbd36f35e71201ec2e3f4e1b',PW_SALT='hireyid-mphub-v1',PW_ITER=250000;
const KEY='mphub.v2',AUTH='mphub.auth';

const DEFAULT_APPS={
  rf:{name:'Recruiterflow',url:'https://recruiterflow.com/'},
  outlook:{name:'Outlook',url:'https://outlook.office.com/mail/'},
  wa:{name:'WhatsApp',url:'https://web.whatsapp.com/'},
  cal:{name:'Google Calendar',url:'https://calendar.google.com/'},
  zoom:{name:'Zoom Scheduler',url:'https://scheduler.zoom.us/'},
  li:{name:'LinkedIn',url:'https://www.linkedin.com/feed/'},
  gpt:{name:'ChatGPT',url:'https://chatgpt.com/'},
  sp:{name:'SharePoint',url:'https://www.office.com/launch/sharepoint'}
};
const STEPS=[
  {id:'apps',t:'Check new applicants',tip:'Strong fit → message them · Unsure → tag Tirzah · Not a fit → disqualify',apps:['rf']},
  {id:'mail',t:'Check email',tip:'Reply to candidates and clients',apps:['outlook']},
  {id:'wa',t:'Check WhatsApp',tip:'New messages and resumes — add any new candidates to Recruiterflow',apps:['wa']},
  {id:'cal',t:'Look at today\'s calls',tip:'Text "good luck" before every interview',apps:['cal','zoom']},
  {id:'calls',t:'Do screenings & interviews',tip:'Use the Intake / Interview note template in Recruiterflow',apps:['rf']},
  {id:'notes',t:'Update Recruiterflow after calls',tip:'Notes, tags, custom fields, move the stage',apps:['rf']},
  {id:'fu',t:'Follow-ups',tip:'Recruiterflow → Tasks → what\'s due or overdue',apps:['rf']},
  {id:'search',t:'Search for candidates',tip:'ChatGPT plugin + advanced search, then LinkedIn',apps:['gpt','li']},
  {id:'post',t:'Post a job',tip:'WhatsApp status (once a week per job) and LinkedIn',apps:['wa','li']},
  {id:'connect',t:'LinkedIn: connect with 10 people',tip:'Regional managers, management, recruiters — message new connections',apps:['li']}
];
const ONB=[
  ['Setup','Set Zoom Scheduler availability (from 10am) → get booking link','Open Zoom Scheduler → your schedule → Availability → Mon–Fri from 10:00, check time zone → Save → Copy link.','https://scheduler.zoom.us/'],
  ['Setup','Add booking link to email templates + signature','Recruiterflow → Settings → Templates → Email templates → Clone → replace the Calendly link with your Zoom link → leave "shared" unticked → Save.','https://recruiterflow.com/'],
  ['Setup','Outlook email signature','Outlook → ⚙ Settings (top right) → Account → Signatures → New: name, title, Pro Talent Solutions, phone, booking link → set as default → Save.','https://outlook.office.com/mail/'],
  ['Setup','Connect Outlook ↔ Google Calendar','Outlook ⚙ → Calendar → Shared calendars → Publish a calendar → "Can view all details" → Publish → copy the ICS link. Google Calendar → Other calendars + → From URL → paste → Add. Blocked? Ask Tirzah.','https://outlook.office.com/calendar/'],
  ['Setup','Connect Zoom to Recruiterflow (notetaker)','Recruiterflow → Settings → Integrations → Zoom → Connect → sign in with your work Zoom → Allow. Can\'t find it? Ask Tirzah.','https://recruiterflow.com/'],
  ['Setup','Recruiterflow Chrome extension — log in + sync','Chrome Web Store → search "Recruiterflow" → Add to Chrome → pin it (puzzle icon) → click it → log in with work email → test on a LinkedIn profile.','https://chromewebstore.google.com/search/recruiterflow'],
  ['Setup','Fix SharePoint/OneDrive access with Tirzah','Outlook → 9 dots (top left) → SharePoint → open the PTS site → Documents. Only see "Company share"? Screenshot it to Tirzah.','https://www.office.com/launch/sharepoint'],
  ['Setup','Sync OneDrive + watch SharePoint videos','PTS SharePoint → Documents → "Sync" (or "Add shortcut to My files") → sign in to the OneDrive app → watch the videos Tirzah points you to.','https://www.office.com/launch/sharepoint'],
  ['Setup','OneDrive contacts onto my phone','Phone: install Outlook app → sign in with work email → Settings → your account → turn on Sync/Save contacts.','https://www.microsoft.com/microsoft-365/outlook/mobile-email-app'],
  ['Setup','ChatGPT Pro + Recruiterflow plugin','ChatGPT (ask Tirzah which account) → Settings → Apps → search "Recruiterflow" → Connect → log in with work email → test: type @Recruiterflow + a search.','https://chatgpt.com/'],
  ['Setup','Make Shloime admin on any WhatsApp group I create','WhatsApp → open the group → tap the group name → tap Shloime → "Make group admin".','https://web.whatsapp.com/'],
  ['LinkedIn','Banner + connect profile to PTS','Canva → "LinkedIn banner" → design → download. LinkedIn → your profile → pencil on banner → upload. Then Add section → Position → pick the Pro Talent Solutions company page → Save.','https://www.linkedin.com/in/me/'],
  ['LinkedIn','Decide on LinkedIn Premium','Compare plans on the Premium page → ask Shloime if PTS pays before you buy.','https://www.linkedin.com/premium/'],
  ['LinkedIn','Agree my title with PTS','Ask Shloime: "Is \'Executive Recruiter\' OK for LinkedIn and my signature?" → use it in both.',''],
  ['Ask Shloime / Tirzah','Which roles / clients I own','Ask Shloime at your one-on-one: "Which roles and clients are mine — property management, Emerald Empire?"',''],
  ['Ask Shloime / Tirzah','Nicer job pages + WhatsApp images','Show Shloime 1–2 examples of what you\'d change → ask if you can update them.',''],
  ['Ask Shloime / Tirzah','What "100–105K only there" means','Ask Shloime or Tirzah what this note refers to → write the answer here.',''],
  ['Ask Shloime / Tirzah','Get added to team emails','Ask Tirzah: "Can you add me to the team email list?"',''],
  ['Ask Shloime / Tirzah','"CRRC 7031 / 2027" — what is it?','Ask Shloime or Tirzah → write the answer here.',''],
  ['Ask Shloime / Tirzah','Daily WhatsApp status OK? (handbook: once a week)','Ask Tirzah: "Can I post to my status daily if it\'s a different job each day?"',''],
  ['Other','Watch Shloime\'s video','Ask Shloime for the link → watch → jot down 3 takeaways.',''],
  ['Other','Sign the handbook acknowledgement','Handbook PDF → last page (p. 22) → sign (print, or Adobe "Fill & Sign") → send to Tirzah.','https://ptshandbook.lovable.app/']
];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const time=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});

function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(!s){s={apps:{},day:'',done:{},onb:{}};
    try{const old=JSON.parse(localStorage.getItem('mphub.v1')||'null');if(old&&old.onboard)old.onboard.forEach(o=>{if(o.done){const i=ONB.findIndex(x=>x[1].slice(0,20)===o.text.slice(0,20));if(i>=0)s.onb[i]=Date.now()}})}catch(e){}}
  s.apps=s.apps||{};s.done=s.done||{};s.onb=s.onb||{};
  if(s.day!==today()){s.day=today();s.done={}}
  return s;
}
let st=load(),tab='today',pending=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
const app=k=>Object.assign({},DEFAULT_APPS[k],st.apps[k]||{});

async function derive(pw){const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(PW_SALT),iterations:PW_ITER,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
function authed(){try{const a=JSON.parse(localStorage.getItem(AUTH)||sessionStorage.getItem(AUTH)||'null');return a&&a.h===PW_HASH&&a.exp>Date.now()}catch(e){return false}}
$('#lockForm').addEventListener('submit',async e=>{e.preventDefault();const er=$('#lockErr');er.textContent='Checking…';try{if(await derive($('#pw').value)===PW_HASH){const r=$('#remember').checked;try{(r?localStorage:sessionStorage).setItem(AUTH,JSON.stringify({h:PW_HASH,exp:Date.now()+(r?30:1)*864e5}))}catch(x){}er.textContent='';start()}else er.textContent='That password is not right.'}catch(x){er.textContent='This browser cannot check the password.'}});

function viewToday(){
  if(st.day!==today()){st.day=today();st.done={};save()}
  const n=STEPS.filter(s=>st.done[s.id]).length;
  return `<div class="progress" style="border-color:var(--accent)"><div class="txt"><span>Daily run with Claude</span></div>
    <div class="tip" style="margin-bottom:10px">1. Open your work tabs in Chrome. 2. Open Claude in Chrome. 3. Paste this. Claude lists what came in, merges repeats, suggests actions, and does nothing until you confirm.</div>
    <button class="btn primary" data-a="copyRun">Copy my daily run</button></div>
  <div class="progress"><div class="txt"><span>${n===STEPS.length?'All done for today 🎉':'Today\'s steps'}</span><span>${n} of ${STEPS.length}</span></div><div class="bar"><i style="width:${n/STEPS.length*100}%"></i></div></div>
  ${STEPS.map((s,i)=>{const d=st.done[s.id];return `<div class="step${d?' done':''}"><div class="num">${d?'✓':i+1}</div><div class="body"><div class="title">${esc(s.t)}</div><div class="tip">${esc(s.tip)}</div>${d?`<div class="when">Done at ${time(d)}</div>`:''}
    <div class="acts">${s.apps.map(k=>`<a class="btn small" href="${esc(app(k).url)}" target="_blank" rel="noopener">Open ${esc(app(k).name)}</a>`).join('')}${d?`<button class="btn small ghost" data-a="undo" data-v="${s.id}">Undo</button>`:`<button class="btn small primary" data-a="ask" data-v="${s.id}">Done</button>`}</div></div></div>`}).join('')}
  <div class="apps"><h2>All my apps</h2>${Object.keys(DEFAULT_APPS).map(k=>`<a href="${esc(app(k).url)}" target="_blank" rel="noopener">${esc(app(k).name)}</a>`).join('')}</div>
  <details class="edit"><summary>Change app links</summary>${Object.keys(DEFAULT_APPS).map(k=>`<div class="editrow"><input value="${esc(app(k).name)}" data-app="${k}" data-f="name"><input value="${esc(app(k).url)}" data-app="${k}" data-f="url"></div>`).join('')}<p style="margin-top:8px">Paste the address from your Chrome tab. Saves automatically.</p></details>`;
}
function viewOnb(){
  const n=Object.keys(st.onb).length;let sec='';
  return `<div class="progress"><div class="txt"><span>Onboarding</span><span>${n} of ${ONB.length}</span></div><div class="bar"><i style="width:${n/ONB.length*100}%"></i></div></div>
  ${ONB.map(([s,t,how,url],i)=>{const d=st.onb[i];const h=s!==sec?`<div class="sec">${esc(sec=s)}</div>`:'';return h+`<div class="step${d?' done':''}"><div class="num">${d?'✓':''}</div><div class="body"><div class="title">${esc(t)}</div>${how?`<div class="tip">${esc(how)}</div>`:''}${d?`<div class="when">Done ${new Date(d).toLocaleDateString()}</div>`:''}${url?`<div class="acts"><a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Go →</a></div>`:''}</div>${d?`<button class="btn small ghost" data-a="onbUndo" data-v="${i}">Undo</button>`:`<button class="btn small primary" data-a="onbAsk" data-v="${i}">Done</button>`}</div>`}).join('')}`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  $('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('#main').innerHTML=tab==='today'?viewToday():viewOnb();
}
const RUN=`DAILY RUN — Pro Talent Solutions recruiting
You are my recruiting assistant. Work only in my open tabs: Outlook, Recruiterflow, WhatsApp Web, Google Calendar, Zoom Scheduler, LinkedIn.

STEP 1 — GATHER (read only). List everything new since my last run (or since yesterday 5pm): new applicants and tasks due in Recruiterflow, new emails in Outlook, unread WhatsApp chats, today's calls on my calendar, LinkedIn messages and connection requests.

STEP 2 — MERGE. Group items about the same person across apps (match by name, email or phone) into ONE row, and show every app they appeared in. Check whether each person already has a Recruiterflow profile.

STEP 3 — PROPOSE. Give me a numbered table: # · person · apps seen · what came in · proposed action · draft message. Follow PTS rules:
- Strong fit → outreach email with my Zoom Scheduler link: [PASTE LINK]
- Unsure → tag @Tirzah in Recruiterflow for an intake
- Not a fit → disqualify from that job only. If I already spoke to them: move to Sourced first and send a personal note instead of the automatic rejection
- Not in Recruiterflow yet → add them (check location, contact details, experience)
- Call today → "good luck" text before an interview
- Follow-ups due → draft the follow-up

STEP 4 — WAIT. Do nothing yet. I will reply with edits, e.g. "3: tag Tirzah instead", "skip 5", "change the draft for 2 to…".

STEP 5 — ACT ONLY AFTER I TYPE "CONFIRM". Then do the confirmed items one at a time and tell me when each is done. Ask me if anything is unclear.

Rules: never send, disqualify or delete anything I have not confirmed. On LinkedIn, only read and draft — I will press send myself. Never copy candidate or client information anywhere outside these apps.`;
function ask(title,text,fn){pending=fn;$('#mTitle').textContent=title;$('#mText').textContent=text;$('#modal').hidden=false}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='copyRun'){navigator.clipboard.writeText(RUN).then(()=>{b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy my daily run',2000)},()=>{const t=document.createElement('textarea');t.value=RUN;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();b.textContent='Copied ✓'})}
  else if(a==='tab'){tab=v;render()}
  else if(a==='lock'){try{localStorage.removeItem(AUTH);sessionStorage.removeItem(AUTH)}catch(x){}$('#app').hidden=true;$('#lock').hidden=false;$('#pw').value=''}
  else if(a==='ask'){const s=STEPS.find(s=>s.id===v);ask('Did you finish this?',s.t,()=>{st.done[v]=Date.now()})}
  else if(a==='undo'){delete st.done[v];save();render()}
  else if(a==='onbAsk'){ask('Did you finish this?',ONB[v][1],()=>{st.onb[v]=Date.now()})}
  else if(a==='onbUndo'){delete st.onb[v];save();render()}
  else if(a==='mYes'){if(pending)pending();pending=null;$('#modal').hidden=true;save();render()}
  else if(a==='mNo'){pending=null;$('#modal').hidden=true}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.app){const k=el.dataset.app;st.apps[k]=Object.assign({},st.apps[k]||{},{[el.dataset.f]:el.value.trim()||DEFAULT_APPS[k][el.dataset.f]});save();render();const d=document.querySelector('details.edit');if(d)d.open=true}});

function start(){$('#lock').hidden=true;$('#app').hidden=false;render()}
if(authed())start();else $('#pw').focus();
})();
</script>
</body>
</html>
