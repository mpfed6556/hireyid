<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>MP Hub</title>

<style>
:root{--bg:#FCFAF7;--card:#FFFFFF;--sand:#F4F0EA;--ink:#211C17;--soft:#544E48;--muted:#928B83;--line:#ECE7DE;--accent:#C4724A;--accent-dk:#AB5E38;--green:#3E9B6B;--green-bg:#E6F4EC;--shadow:0 1px 10px rgba(33,28,23,.05)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px;min-height:100vh}
h1,h2{font-family:'DM Serif Display',serif;font-weight:400}
button,input{font:inherit;color:inherit}
input{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.head h1{font-size:1.7rem;flex:1}.head h1 span{color:var(--accent)}
.date{color:var(--muted);margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:.92rem;cursor:pointer;background:var(--sand);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-dk)}
.btn.good{background:var(--green);color:#fff}
.btn.small{padding:6px 12px;font-size:.82rem;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.progress .txt{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.bar{height:8px;background:var(--sand);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.num{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--sand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.step.done{background:var(--green-bg);border-color:transparent}
.step.done .num{background:var(--green);color:#fff}
.step.done .title{text-decoration:line-through;color:var(--muted)}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:1.02rem}
.tip{color:var(--soft);font-size:.86rem;margin-top:2px}
.when{color:var(--green);font-size:.8rem;font-weight:600;margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:24px}
.apps h2{grid-column:1/-1;font-size:1.2rem}
.apps a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:600;text-decoration:none;color:var(--ink);font-size:.9rem}
.apps a:hover{border-color:var(--accent)}
.sec{font-weight:700;color:var(--soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
details.edit{margin-top:28px;color:var(--soft);font-size:.9rem}
details.edit summary{cursor:pointer}
.editrow{display:grid;grid-template-columns:1fr 2fr;gap:6px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal .box{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center}
.modal .box h2{font-size:1.3rem;margin-bottom:6px}
.modal .box p{color:var(--soft);margin-bottom:18px}
.modal .acts{justify-content:center}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#lock form{width:100%;max-width:340px;display:grid;gap:12px;text-align:center}
#lock h1{font-size:2rem}#lock h1 span{color:var(--accent)}
#lock .err{color:#C94848;font-size:.88rem;min-height:1.2em}
#lock label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:.88rem;color:var(--soft)}
#lock label input{width:auto}
.wrap{max-width:1040px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}

.chip{display:inline-block;font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--sand);color:var(--soft);margin:1px 2px 1px 0}
.chip.cl{background:#EDF3FB;color:#3E7BC4}.chip.ca{background:#F6EADE;color:#AB5E38}.chip.x2{background:#FBF3E1;color:#B7862A}
.tick{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;color:var(--muted)}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.over{color:#C94848!important;font-weight:700}
.addbox{display:grid;gap:8px;grid-template-columns:1fr;margin-top:10px}

.addbox label,.sheet label{font-size:.76rem;font-weight:600;color:var(--soft);display:block;margin-bottom:3px}
textarea{font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-height:44px;resize:vertical}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:600;cursor:pointer}

.panel{border:1.5px solid var(--accent);border-radius:12px;padding:12px;margin-top:12px}
.panel textarea{min-height:200px;font-size:.88rem}
.cols{display:grid;gap:14px}@media(min-width:900px){.cols{grid-template-columns:1.1fr .9fr}.sticky{position:sticky;top:12px;align-self:start}}
[hidden]{display:none!important}
</style>
</head>

const $=s=>document.querySelector(s);

async function derive(pw){const enc=new TextEncoder();const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(PW_SALT),iterations:PW_ITER,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
function authed(){try{const a=JSON.parse(localStorage.getItem(AUTH)||sessionStorage.getItem(AUTH)||'null');return a&&a.h===PW_HASH&&a.exp>Date.now()}catch(e){return false}}

const normEmail=e=>String(e||'').trim().toLowerCase();
const normPhone=p=>{const d=String(p||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):''};
const normName=n=>String(n||'').toLowerCase().replace(/[^a-z֐-׿\s]/g,' ').split(/\s+/).filter(Boolean).sort().join(' ');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function extract(t){t=String(t||'');return{email:(t.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/)||[''])[0],phone:((t.match(/\+?\d[\d\s().-]{8,}\d/g)||[]).map(normPhone).find(Boolean))||''}}
function guessName(t){for(let l of String(t||'').split('\n')){l=l.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,'').replace(/\+?\d[\d\s().-]{8,}\d/g,'').replace(/^(from|name)\s*:\s*/i,'').replace(/[<>|,;:]+/g,' ').trim();if(l&&/^[\p{L}'.\- ]{3,40}$/u.test(l)&&l.split(/\s+/).length<=4)return l}return''}
function sameAs(a,b){
  if(normEmail(a.email)&&normEmail(a.email)===normEmail(b.email))return 'sure';
  if(normPhone(a.phone)&&normPhone(a.phone)===normPhone(b.phone))return 'sure';
  const x=normName(a.name),y=normName(b.name);
  if(x&&y&&(x===y||(Math.min(x.length,y.length)>=8&&lev(x,y)<=2)))return 'maybe';

function mergeInto(keep,o){
  ['phone','email','company'].forEach(k=>{if(!keep[k]&&o[k])keep[k]=o[k]});
  if((o.name||'').length>(keep.name||'').length)keep.name=o.name;
  keep.from=[...new Set((keep.from||[]).concat(o.from||[]))];
  keep.hits=(keep.hits||1)+(o.hits||1);
  if(o.ans)Object.keys(o.ans).forEach(k=>{if(!keep.ans[k])keep.ans[k]=o.ans[k]});
  if(o.notes)keep.notes=(keep.notes?keep.notes+'\n':'')+o.notes;
  ['met','rf'].forEach(k=>{if(!keep[k]&&o[k])keep[k]=o[k]});
  if(!keep.call&&o.call)keep.call=o.call;if(!keep.fu&&o.fu)keep.fu=o.fu;
}

function dupPairs(){

}

    <div class="acts">${s.apps.map(k=>`<a class="btn small" href="${esc(app(k).url)}" target="_blank" rel="noopener">Open ${esc(app(k).name)}</a>`).join('')}${d?`<button class="btn small ghost" data-a="undo" data-v="${s.id}">Undo</button>`:`<button class="btn small primary" data-a="ask" data-v="${s.id}">Done</button>`}</div></div></div>`}).join('')}
  <div class="apps"><h2>All my apps</h2>${Object.keys(DEFAULT_APPS).map(k=>`<a href="${esc(app(k).url)}" target="_blank" rel="noopener">${esc(app(k).name)}</a>`).join('')}</div>
  <details class="edit"${st.zoom?'':' open'}><summary>My details & app links</summary><div class="editrow"><input value="My name" disabled><input data-me="me" value="${esc(st.me||'Miriam')}"></div><div class="editrow"><input value="Zoom booking link" disabled><input data-me="zoom" placeholder="Paste your Zoom Scheduler link" value="${esc(st.zoom||'')}"></div>${Object.keys(DEFAULT_APPS).map(k=>`<div class="editrow"><input value="${esc(app(k).name)}" data-app="${k}" data-f="name"><input value="${esc(app(k).url)}" data-app="${k}" data-f="url"></div>`).join('')}<p style="margin-top:8px">Paste the address from your Chrome tab. Saves automatically.</p></details>`;
}
function viewOnb(){
  const n=Object.keys(st.onb).length;let sec='';
  return `<div class="progress"><div class="txt"><span>Onboarding</span><span>${n} of ${ONB.length}</span></div><div class="bar"><i style="width:${n/ONB.length*100}%"></i></div></div>
  ${ONB.map(([s,t,how,url],i)=>{const d=st.onb[i];const h=s!==sec?`<div class="sec">${esc(sec=s)}</div>`:'';return h+`<div class="step${d?' done':''}"><div class="num">${d?'✓':''}</div><div class="body"><div class="title">${esc(t)}</div>${how?`<div class="tip">${esc(how)}</div>`:''}${d?`<div class="when">Done ${new Date(d).toLocaleDateString()}</div>`:''}${url?`<div class="acts"><a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Go →</a></div>`:''}</div>${d?`<button class="btn small ghost" data-a="onbUndo" data-v="${i}">Undo</button>`:`<button class="btn small primary" data-a="onbAsk" data-v="${i}">Done</button>`}</div>`}).join('')}`;
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  $('#date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('#main').innerHTML=tab==='today'?viewToday():viewOnb();
  document.querySelectorAll('textarea[data-q]').forEach(t=>{if(t.value){t.style.height='auto';t.style.height=t.scrollHeight+'px'}});
}
const RUN=`DAILY RUN — Pro Talent Solutions recruiting
You are my recruiting assistant. Work only in my open tabs: Outlook, Recruiterflow, WhatsApp Web, Google Calendar, Zoom Scheduler, LinkedIn.

STEP 1 — GATHER (read only). List everything new since my last run (or since yesterday 5pm): new applicants and tasks due in Recruiterflow, new emails in Outlook, unread WhatsApp chats, today's calls on my calendar, LinkedIn messages and connection requests.

STEP 2 — MERGE. Group items about the same person across apps (match by name, email or phone) into ONE row, and show every app they appeared in. Check whether each person already has a Recruiterflow profile.

STEP 3 — PROPOSE. Give me a numbered table: # · person · apps seen · what came in · proposed action · draft message. Follow PTS rules:
- Strong fit → outreach email with my Zoom Scheduler link: [PASTE LINK]
- Unsure → tag @Tirzah in Recruiterflow for an intake
- Not a fit → disqualify from that job only. If I already spoke to them: move to Sourced first and send a personal note instead of the automatic rejection
- Not in Recruiterflow yet → add them (check location, contact details, experience)
- Call today → "good luck" text before an interview
- Follow-ups due → draft the follow-up

STEP 4 — WAIT. Do nothing yet. I will reply with edits, e.g. "3: tag Tirzah instead", "skip 5", "change the draft for 2 to…".

STEP 5 — ACT ONLY AFTER I TYPE "CONFIRM". Then do the confirmed items one at a time and tell me when each is done. Ask me if anything is unclear.

Rules: never send, disqualify or delete anything I have not confirmed. On LinkedIn, only read and draft — I will press send myself. Never copy candidate or client information anywhere outside these apps.`;
let pendingNo=null;
function ask(title,text,fn){
  let o=typeof title==='object'?title:{title,text,onYes:fn};
  pending=o.onYes;pendingNo=o.onNo||null;$('#mTitle').textContent=o.title;$('#mText').textContent=o.text||'';
  $('#mYesB').textContent=o.yes||'Yes, done ✓';$('#mNoB').textContent=o.no||'Not yet';$('#modal').hidden=false;
}
const TICK_Q={repEmail:'Did you reply to {n} by email today?',repWa:'Did you reply to {n} on WhatsApp today?',met:'Did you finish the call with {n}?',rf:'Did you update Recruiterflow for {n} (notes, tags, fields, stage)?'};

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='copyRun'){navigator.clipboard.writeText(RUN).then(()=>{b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy my daily run',2000)},()=>{const t=document.createElement('textarea');t.value=RUN;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();b.textContent='Copied ✓'})}
  else if(a==='tab'){tab=v;render()}
  else if(a==='lock'){try{localStorage.removeItem(AUTH);sessionStorage.removeItem(AUTH)}catch(x){}$('#app').hidden=true;$('#lock').hidden=false;$('#pw').value=''}
  else if(a==='ask'){const s=STEPS.find(s=>s.id===v);ask('Did you finish this?',s.t,()=>{st.done[v]=Date.now()})}
  else if(a==='undo'){delete st.done[v];save();render()}
  else if(a==='onbAsk'){ask('Did you finish this?',ONB[v][1],()=>{st.onb[v]=Date.now()})}
  else if(a==='onbUndo'){delete st.onb[v];save();render()}
  else if(a==='mYes'){if(pending)pending();pending=null;pendingNo=null;$('#modal').hidden=true;save();render()}
  else if(a==='mNo'){const f=pendingNo;pending=null;pendingNo=null;$('#modal').hidden=true;if(f){f();save();render()}}
  else if(a==='addToggle'){st.adding=!st.adding;render()}
  else if(a==='addType'){addType=v;render()}
  else if(a==='addSave'){addPerson()}
  else if(a==='filter'){filter=v;render()}
  else if(a==='tick'){const p=P(b.dataset.id),daily=v==='repEmail'||v==='repWa',on=daily?isToday(p[v]):!!p[v];
    if(on)ask({title:'Undo this tick?',text:p.name,yes:'Yes, undo',no:'Keep it',onYes:()=>{p[v]=0}});
    else ask({title:'Confirm',text:TICK_Q[v].replace('{n}',p.name),onYes:()=>{p[v]=Date.now()}})}
  else if(a==='dupReview'){const d=dupPairs().find(x=>x.k===v);if(d)ask({title:'Same person?',text:`${d.a.name} (${(d.a.from||[]).join(', ')}) and ${d.b.name} (${(d.b.from||[]).join(', ')}) — ${d.s==='sure'?'same phone or email':'similar name'}.`,yes:'Yes, merge',no:'Different people',onYes:()=>{mergeInto(d.a,d.b);st.people=st.people.filter(x=>x.id!==d.b.id)},onNo:()=>{st.notDup.push(d.k)}})}
  else if(a==='open'){openId=b.dataset.id;panel=null;render();window.scrollTo(0,0)}
  else if(a==='close'){openId=null;panel=null;render()}
  else if(a==='mode'){P(b.dataset.id).mode=v;panel=null;save();render()}
  else if(a==='act'){const p=P(openId);panel=Object.assign({k:v},buildPanel(p,v));render()}
  else if(a==='pCopy'){const t=$('#panelText').value;navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied ✓'},()=>{})}
  else if(a==='pSend'){const p=P(openId),t=$('#panelText').value;let u='';
    if(v==='wa')u=p.phone?`https://wa.me/${waNum(p)}?text=${encodeURIComponent(t)}`:`https://wa.me/?text=${encodeURIComponent(t)}`;
    if(v==='sms')u=`sms:${p.phone?'+'+waNum(p):''}?&body=${encodeURIComponent(t)}`;
    if(v==='mail'){let subj='',body=t;const m=t.match(/^Subject:\s*(.*)\n+/);if(m){subj=m[1];body=t.slice(m[0].length)}u=`https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(p.email||'')}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}
    window.open(u,'_blank','noopener')}
  else if(a==='pPage'){openJobPage(P(openId))}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.q){const p=P(el.dataset.id);if(p){p.ans[el.dataset.q]=el.value;save()}el.style.height='auto';el.style.height=el.scrollHeight+'px'}
  if(el.id==='panelText'&&panel)panel.text=el.value;
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.me){st[el.dataset.me]=el.value.trim();save();return}
  if(el.dataset.pf){const p=P(el.dataset.id);if(!p)return;const f=el.dataset.pf,old=p[f];p[f]=el.value;
    if(f==='status'&&el.value==='Not a fit'){ask({title:'Mark as not a fit?',text:'In Recruiterflow: disqualify from Applied (sends the automatic email). Already spoke to them? Move to Sourced first and send a personal note instead.',yes:'Yes, not a fit',no:'Cancel',onYes:()=>{},onNo:()=>{p.status=old}});return}
    save();if(f!=='name'&&f!=='phone'&&f!=='email'&&f!=='company')render();return}if(el.dataset.app){const k=el.dataset.app;st.apps[k]=Object.assign({},st.apps[k]||{},{[el.dataset.f]:el.value.trim()||DEFAULT_APPS[k][el.dataset.f]});save();render();const d=document.querySelector('details.edit');if(d)d.open=true}});

function start(){$('#lock').hidden=true;$('#app').hidden=false;render()}
if(authed())start();else $('#pw').focus();
})();
</script>
</body>
</html>
