<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Yossi Federman</title>
<meta name="description" content="Yossi Federman: peer support, mental health and inspirational speaking. Book a session.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --bg2:#ffffff; --panel:#ffffff; --line:rgba(16,32,63,.13);
    --gold:#b08a3e; --gold-soft:#8a6a26; --text:#14213d; --muted:#5a6478;
    --navy:#10203f; --navy-2:#1d3461; --shadow:0 10px 30px rgba(16,32,63,.08);
    --say:#5fa8d3; --sing:#d6af5c; --show:#9b8cf0; --play:#6fc59b;
    --radius:16px; --fs:1rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.65;font-size:var(--fs);-webkit-text-size-adjust:100%}
  body.big{--fs:1.25rem}
  .script{font-family:Caveat,cursive;font-weight:700;color:var(--gold)}
  h1,h2,h3,.headline,.subhead,blockquote,.spoken{font-family:"Source Serif 4",Georgia,serif}
  a{color:inherit}
  button{font:inherit}

  /* ---------- Gate (poster style) ---------- */
  #gate{--g:#d6af5c;--gs:#ecd49a;min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:#0a1530;color:#f4efe4;overflow:hidden}
  .gate-photo{position:relative;min-height:100%}
  .gate-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
  .gate-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,21,48,0) 45%,#0a1530 100%),linear-gradient(0deg,rgba(10,21,48,.35),transparent 40%)}
  .gate-main{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,5vw,72px);max-width:620px;background:radial-gradient(ellipse at 0% 20%,rgba(214,175,92,.12),transparent 60%)}
  .gate-name{font-family:Caveat,cursive;font-weight:700;color:var(--g);font-size:clamp(4.5rem,9vw,7.5rem);line-height:.85;text-shadow:0 4px 30px rgba(214,175,92,.25)}
  .gate-head{font-family:"Source Serif 4",serif;font-size:clamp(2rem,3.6vw,2.8rem);font-weight:600;line-height:1.1;margin-top:6px}
  .gate-sub{font-family:"Source Serif 4",serif;font-size:clamp(1.2rem,2.2vw,1.6rem);color:#d9dfeb}
  .gate-kicker{margin-top:22px;padding-top:14px;border-top:1px solid rgba(214,175,92,.55);color:var(--g);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
  .gate-msg{margin-top:8px;font-size:1.08rem;line-height:1.55;color:#e3e7ef}
  .gate-msg em{font-family:Caveat,cursive;font-style:normal;font-size:1.5em;color:var(--gs);display:block;line-height:1.2;margin-top:2px}
  .gate-form{display:flex;gap:10px;margin-top:20px}
  .gate-form input{flex:1;min-width:0;padding:14px 16px;border-radius:12px;border:1px solid rgba(214,175,92,.6);background:rgba(255,255,255,.06);color:#fff;font-size:1.05rem;outline:none}
  .gate-form input::placeholder{color:#aab3c5}
  .gate-form input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(214,175,92,.25)}
  .gate-form button{padding:14px 26px;border:0;border-radius:12px;background:var(--g);color:#1a1405;font-weight:700;font-size:1.05rem;cursor:pointer}
  .gate-form button:hover{background:var(--gs)}
  .gate-form button:disabled{opacity:.6;cursor:wait}
  #gateErr{color:#ff9a8a;min-height:1.4em;margin-top:8px;font-size:.92rem}
  .gate-contact{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .gate-contact a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#f4efe4;border:1px solid rgba(214,175,92,.45);border-radius:999px;padding:9px 16px;font-size:.95rem;min-height:44px}
  .gate-contact a span{color:var(--g)}
  .gate-contact a:hover{background:rgba(214,175,92,.12)}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @media (max-width:760px){
    #gate{display:flex;flex-direction:column}
    .gate-photo{height:33svh;min-height:180px;flex:none}
    .gate-photo img{object-position:50% 6%}
    .gate-photo::after{background:linear-gradient(180deg,rgba(10,21,48,0) 50%,#0a1530 100%)}
    .gate-main{padding:0 20px 24px;margin-top:-34px;position:relative;text-align:center;align-items:stretch;justify-content:flex-start}
    .gate-name{font-size:4rem}
    .gate-head{font-size:1.75rem}
    .gate-sub{font-size:1.1rem}
    .gate-kicker{margin-top:14px;padding-top:10px}
    .gate-msg{font-size:1rem}
    .gate-form{margin-top:14px}
    .gate-form button{padding:14px 18px}
    .gate-contact{justify-content:center;gap:6px;margin-top:2px}
    .gate-contact a{font-size:.8rem;padding:6px 10px;min-height:40px;gap:5px}
    #gateErr{min-height:0;margin-top:6px}
    #gateErr:empty{margin-top:4px}
  }

  /* ---------- Nav ---------- */
  .topnav{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-family:Caveat,cursive;font-size:1.9rem;font-weight:700;color:var(--gold);text-decoration:none;line-height:1}
  .navlinks{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  .navlinks::-webkit-scrollbar{display:none}
  .navlinks a{text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:500;padding:6px 12px;border-radius:8px;white-space:nowrap}
  .navlinks a:hover{color:var(--text);background:rgba(16,32,63,.06)}
  .nav-cta{margin-left:auto;text-decoration:none;background:var(--navy);color:#fff;font-weight:600;font-size:.88rem;padding:8px 16px;border-radius:8px;white-space:nowrap}
  .nav-cta:hover{background:var(--navy-2)}
  .navtools{display:flex;gap:8px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--gold-soft);padding:6px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;white-space:nowrap}
  .chip:hover,.chip[aria-pressed="true"]{background:var(--gold);color:#1a1405}

  /* ---------- Hero ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:center;max-width:1120px;margin:0 auto;padding:24px 24px;min-height:calc(100vh - 58px);min-height:calc(100svh - 58px)}
  .hero-photo img{height:min(calc(100svh - 120px),640px);width:auto;max-width:100%;margin:0 auto;aspect-ratio:auto;object-fit:contain}
  .pitch{margin-top:18px;font-size:1.25rem;line-height:1.5;max-width:30ch}
  .pitch .script{font-size:1.5em}
  .see-more{display:inline-block;margin-top:22px;color:var(--muted);text-decoration:none;font-size:.95rem;font-weight:500}
  .see-more:hover{color:var(--navy)}
  .hire-bio{margin:0 auto 16px;text-align:left}
  .hire .facts{text-align:left;margin:0 0 20px}
  .hero-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:22px;border:1px solid var(--line);box-shadow:0 24px 50px rgba(16,32,63,.18);display:block}
  .hero-photo{margin:0}
  .hero-photo figcaption{margin-top:14px;font-family:"Source Serif 4",serif;font-style:italic;color:var(--muted);font-size:1rem;text-align:center;line-height:1.5}
  .name{font-size:clamp(2.4rem,5vw,3.6rem);line-height:1.05;margin-top:14px;color:var(--navy);letter-spacing:-.01em}
  .legal{color:var(--muted);font-size:.95rem;margin-top:4px}
  .bio{margin-top:16px;color:var(--text);font-size:1.02rem;line-height:1.7}
  .facts{display:grid;gap:10px;margin-top:20px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .facts div{display:grid;grid-template-columns:110px 1fr;gap:12px}
  .facts dt{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-soft);padding-top:3px}
  .facts dd{font-size:.96rem}
  .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 22px;border-radius:10px;font-weight:600;font-size:.98rem;text-decoration:none;min-height:48px}
  .btn-primary{background:var(--navy);color:#fff}
  .btn-primary:hover{background:var(--navy-2)}
  .btn-outline{border:1.5px solid var(--navy);color:var(--navy);background:transparent}
  .btn-outline:hover{background:rgba(16,32,63,.06)}
  .hire{max-width:680px;margin:40px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:var(--shadow);text-align:center;scroll-margin-top:70px}
  .hire h2{margin-bottom:10px}
  .hire p{color:var(--muted);line-height:1.7}
  .hire .cta{justify-content:center}
  .contact-line{margin-top:16px;font-size:.92rem}
  .contact-line a{color:var(--navy)}
  .eyebrow{display:inline-block;color:var(--gold-soft);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:500}
  .hero h1.script{font-size:clamp(4.5rem,11vw,7.5rem);line-height:.95;margin-top:14px}
  .headline{font-size:clamp(1.25rem,2.4vw,1.6rem);font-weight:600;line-height:1.3;margin-top:12px;color:var(--gold-soft)}
  .subhead{font-size:clamp(1.3rem,2.6vw,1.8rem);color:var(--muted)}
  .tagline{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
  .script.small{font-size:1.8rem}
  .quote{margin-top:26px;padding:18px 22px;border-left:3px solid var(--gold);background:rgba(255,255,255,.04);border-radius:0 12px 12px 0;font-size:1.2rem}
  .quote .script{display:block;font-size:1.9rem;margin-top:4px}

  /* ---------- Sections ---------- */
  main{max-width:1120px;margin:0 auto;padding:0 24px 64px}
  .section{padding:56px 0;border-top:1px solid var(--line);scroll-margin-top:64px}
  .kicker{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}
  .section h2{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.2;margin:6px 0 10px}
  .lead{color:var(--muted);max-width:60ch;font-size:1.08em}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .card-icon{font-size:1.6rem}
  .card h3{font-size:1.2rem;margin:8px 0 4px;color:var(--gold-soft)}
  .card p{color:var(--muted);font-size:.96em}

  /* ---------- Timeline ---------- */
  .timeline{list-style:none;margin-top:28px;position:relative}
  .timeline::before{content:"";position:absolute;left:35px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .step{display:grid;grid-template-columns:72px 1fr;gap:18px;margin-bottom:18px;position:relative}
  .badge{align-self:start;z-index:1;display:inline-flex;justify-content:center;padding:6px 0;border-radius:999px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#0b1630;margin-top:14px}
  .badge.say{background:var(--say)} .badge.sing{background:var(--sing)} .badge.show{background:var(--show)} .badge.play-b{background:var(--play);padding:6px 16px}
  .step-body{background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;min-width:0}
  .step-body h3{font-size:1.25rem;color:var(--gold-soft)}
  .step-body > p + p{margin-top:10px}
  .spoken{font-size:1.15em;font-style:italic}
  .spoken.big{font-size:1.4em;max-width:52ch}
  .note{margin-top:10px;font-size:.85em;color:#ffcf8a;background:rgba(255,190,90,.1);border:1px dashed rgba(255,190,90,.5);border-radius:8px;padding:6px 10px;display:inline-block}
  .three{list-style:none;margin-top:12px;display:grid;gap:10px}
  .three li{padding-left:14px;border-left:2px solid var(--gold)}
  .three strong{color:var(--gold-soft)}
  details summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"▸ Show words";margin-left:auto;font-size:.82rem;color:var(--gold);font-weight:600}
  details[open] summary::after{content:"▾ Hide words"}
  .tune{color:var(--muted);font-size:.9em;font-style:italic}
  .lyrics{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-family:"Source Serif 4",Georgia,serif;font-size:1.1em;columns:2 260px;column-gap:40px}
  .lyrics p{margin-bottom:14px;break-inside:avoid}
  .lyrics .label{margin-bottom:2px;font-family:Inter,sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);break-after:avoid}

  .media-wrap{margin-top:14px}
  .media-wrap video{width:100%;max-width:720px;display:block;border-radius:12px;border:1px solid var(--line);background:#000;aspect-ratio:352/288}
  .media-wrap audio{width:100%;display:block}
  .media-status{font-size:.85em;color:var(--muted);margin-top:6px}
  .audio-card{display:flex;align-items:center;gap:18px;box-shadow:var(--shadow);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-top:24px;max-width:720px}
  .audio-card > div{flex:1;min-width:0}
  .audio-icon{font-size:2rem;color:var(--gold);width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(176,138,62,.12);flex:none}

  .songs{list-style:none;display:grid;gap:14px;margin-top:22px}
  .song{background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px}
  .song .spoken{margin-bottom:10px;color:var(--muted)}
  .song summary h3{font-size:1.25rem;color:var(--gold-soft)}
  #video video{max-width:820px}
  .lead{margin-top:4px}

  .mission{margin-top:22px;font-family:"Source Serif 4",serif;font-size:1.3rem;font-weight:600}
  .mission .script{display:block;font-size:3rem;line-height:1.1}
  .mission.center{text-align:center;margin:24px auto 0}

  .slideshow{margin-top:22px;outline:none}
  .slides{position:relative;height:min(78vh,720px);border-radius:18px;overflow:hidden;background:#eeebe4;border:1px solid var(--line)}
  .slide{position:absolute;inset:0;margin:0;display:flex;flex-direction:column;justify-content:center;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
  .slide.on{opacity:1;visibility:visible}
  .slide-head{padding:18px 20px 12px;text-align:center;font-family:Caveat,cursive;font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;color:var(--gold);line-height:1.1}
  .slide-head .tag{display:block;font-family:Inter,sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .slide-img{display:flex;justify-content:center;padding:0 12px 14px}
  .slide-img img{max-width:100%;max-height:calc(min(78vh,720px) - 120px);object-fit:contain;border-radius:12px;display:block}
  .ss-progress{margin:12px auto 0;max-width:420px}
  .ss-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
  .ss-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--gold-soft);font-size:1.6rem;line-height:1;cursor:pointer;display:grid;place-items:center}
  .ss-btn:hover{background:var(--gold);color:#1a1405}
  .ss-play{font-size:1.1rem}
  .ss-count{min-width:70px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
  @media (max-width:820px){.slides{height:min(66vh,560px)}.slide-img img{max-height:calc(min(66vh,560px) - 110px)}}

  .struggles{display:grid;grid-template-columns:auto minmax(0,1fr);gap:36px;align-items:center;margin-top:24px;outline:none}
  .body-pic{position:relative;width:min(380px,40vw);line-height:0;overflow:hidden;border-radius:18px;border:1px solid var(--line);flex:none}
  .body-zoom{position:relative;--z:1;transform-origin:0 0;transition:transform .7s ease}
  .body-pic img{width:100%;height:auto;display:block}
  .ring{position:absolute;left:43%;top:66%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border:calc(4px / var(--z)) solid var(--gold);border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 26px 6px rgba(176,138,62,.75);transition:left .7s ease,top .7s ease,width .7s ease;pointer-events:none;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 40px 12px rgba(176,138,62,.9)}}
  .struggle-panel{background:var(--panel);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 20px;min-height:300px;display:flex;flex-direction:column}
  .struggle-list{list-style:none;flex:1}
  .struggle-list li{display:none}
  .struggle-list li.on{display:block;animation:fadein .5s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .struggle-list .part{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .struggle-list h3{font-family:Caveat,cursive;font-size:2.4rem;color:var(--gold);line-height:1.1;margin:2px 0 10px}
  .struggle-list li > p:last-child{font-family:"Source Serif 4",serif;font-size:1.2rem;line-height:1.6}
  .struggle-panel .ss-controls{justify-content:flex-start;margin-top:18px}
  @media (max-width:820px){
    .struggles{grid-template-columns:1fr;gap:18px;justify-items:center}
    .body-pic{width:min(62vw,280px)}
    .struggle-panel{width:100%;min-height:0}
    .struggle-panel .ss-controls{justify-content:center}
  }

  .st-progress{height:4px;border-radius:4px;background:rgba(16,32,63,.1);overflow:hidden;margin-bottom:14px}
  .st-progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .4s ease}
  .body-pic{cursor:pointer;-webkit-tap-highlight-color:transparent}
  @media (hover:hover){.st-hint{display:none}}
  .st-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;margin:0;line-height:1.2;white-space:nowrap;background:rgba(16,32,63,.82);color:#fff;font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;pointer-events:none}

  .songs-tap{margin-top:22px}
  #songs .audio-card{margin-top:16px}

  /* ---------- Page progress (left edge) ---------- */
  .page-progress{position:fixed;left:6px;top:72px;bottom:16px;width:4px;border-radius:4px;background:rgba(16,32,63,.1);z-index:20}
  .page-progress .fill{position:absolute;left:0;top:0;width:100%;height:0;border-radius:4px;background:linear-gradient(var(--gold-soft),var(--gold));box-shadow:0 0 8px rgba(176,138,62,.45)}
  .page-progress a{position:absolute;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--bg);border:2px solid rgba(176,138,62,.6);transition:background .3s,border-color .3s,transform .3s}
  .page-progress a.done{background:var(--gold);border-color:var(--gold)}
  .page-progress a.here{transform:scale(1.35)}
  .page-progress a::after{content:attr(data-label);position:absolute;left:18px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:.78rem;font-weight:600;color:var(--gold-soft);background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
  .page-progress a:hover::after,.page-progress a:focus-visible::after{opacity:1}
  @media (max-width:600px){
    .page-progress{left:3px;top:58px;bottom:10px;width:3px}
    .page-progress a{width:10px;height:10px;margin:-5px 0 0 -5px}
    .page-progress a::after{display:none}
  }

  /* ---------- Booking (Chanukah) ---------- */
  #booking{--g:#d6af5c;--gs:#ecd49a;margin:auto;padding:22px 22px 18px;border:0;border-radius:20px;width:min(400px,calc(100vw - 24px));max-height:calc(100svh - 24px);overflow-y:auto;text-align:center;color:#f4efe4;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,194,74,.26),transparent 60%),linear-gradient(180deg,#152a55,#0a1530 55%);box-shadow:0 30px 90px rgba(0,0,0,.5)}

    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    KEYOBJ = key;
    return new TextDecoder().decode(buf);
  }

  // Folder the page lives in, with a trailing slash, so media resolves the
  // same whether the page was opened as /totty, /totty/ or /totty/index.html.
  function baseDir(){
    var p = location.pathname.replace(/\/index\.html?$/i, '');
    return p.charAt(p.length - 1) === '/' ? p : p + '/';
  }

  async function loadMedia(name, el){
    var m = (P.media || {})[name], status = el.parentNode.querySelector('.media-status');
    if (!m) { if (status) status.textContent = 'Not available.'; return; }
    var url = baseDir() + m.file;
    if (m.plain) {
      el.src = url;
      if (status) status.innerHTML = '<a href="' + url + '" target="_blank" rel="noopener">Not playing? Open it directly</a>';
      return;
    }
    try {
      var res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(m.iv)}, KEYOBJ, await res.arrayBuffer());
      el.src = URL.createObjectURL(new Blob([plain], {type:m.type}));
      if (status) status.remove();
    } catch(e) { if (status) status.textContent = 'Could not load. Check your connection and refresh.'; }
  }


  function slideshow(root){
    var slides = root.querySelectorAll('.slide'), n = slides.length, i = 0, timer = null;
    var count = root.querySelector('.ss-count'), play = root.querySelector('.ss-play');
    var track = document.createElement('div'); track.className = 'st-progress ss-progress'; var bar = document.createElement('span'); track.appendChild(bar);
    root.insertBefore(track, root.querySelector('.ss-controls'));
    function go(k){ slides[i].classList.remove('on'); i = (k + n) % n; slides[i].classList.add('on'); count.textContent = (i+1) + ' / ' + n; bar.style.width = ((i+1) / n * 100) + '%'; }
    function stop(){ clearInterval(timer); timer = null; play.textContent = '▶'; play.setAttribute('aria-label','Play slideshow'); }
    function start(){ stop(); timer = setInterval(function(){ go(i+1); }, 5000); play.textContent = '❚❚'; play.setAttribute('aria-label','Pause slideshow'); }
    root.querySelector('[data-ss="prev"]').onclick = function(){ stop(); go(i-1); };
    root.querySelector('[data-ss="next"]').onclick = function(){ stop(); go(i+1); };
    play.onclick = function(){ timer ? stop() : start(); };
    root.addEventListener('keydown', function(e){ if (e.key === 'ArrowLeft') { stop(); go(i-1); } else if (e.key === 'ArrowRight') { stop(); go(i+1); } });
    var x0 = null, box = root.querySelector('.slides');
    box.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    box.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) { stop(); go(dx < 0 ? i+1 : i-1); } });
    box.addEventListener('click', function(){ stop(); go(i+1); });
    go(0);
  }

  function struggles(root){
    var items = root.querySelectorAll('.struggle-list li'), n = items.length, i = 0;
    var ring = root.querySelector('.ring'), count = root.querySelector('.ss-count'), pic = root.querySelector('.body-pic');
    var list = root.querySelector('.struggle-list'), panel = root.querySelector('.struggle-panel');
    var track = document.createElement('div'); track.className = 'st-progress'; var bar = document.createElement('span'); track.appendChild(bar); panel.insertBefore(track, panel.firstChild);
    var hint = document.createElement('p'); hint.className = 'st-hint'; hint.textContent = 'Tap the photo or swipe';
    pic.addEventListener('click', function(e){ var r = pic.getBoundingClientRect(); go(e.clientX - r.left < r.width * 0.4 ? i-1 : i+1); fit(); hint.remove(); if (navigator.vibrate) navigator.vibrate(8); });
    var zoom = document.createElement('div'); zoom.className = 'body-zoom'; while (pic.firstChild) zoom.appendChild(pic.firstChild); pic.appendChild(zoom); pic.appendChild(hint);
    function go(k){
      items[i].classList.remove('on'); i = (k + n) % n; var it = items[i]; it.classList.add('on');
      var r = +it.dataset.r, z = r >= 30 ? 1 : Math.min(2.6, Math.max(1.4, 16 / r));
      // Centre the circled spot in the frame, without showing empty edges.
      var cl = function(v){ return Math.max(100 - 100 * z, Math.min(0, v)); };
      zoom.style.setProperty('--z', z);
      zoom.style.transform = 'translate(' + cl(50 - it.dataset.x * z) + '%,' + cl(50 - it.dataset.y * z) + '%) scale(' + z + ')';
      ring.style.left = it.dataset.x + '%'; ring.style.top = it.dataset.y + '%'; ring.style.width = (r * 2) + '%';
      count.textContent = (i+1) + ' / ' + n;
      bar.style.width = ((i+1) / n * 100) + '%';
      list.scrollTop = 0;
      fade();
    }
    function fade(){ list.classList.toggle('more', list.scrollHeight - list.scrollTop - list.clientHeight > 4); }
    // On phones, keep the whole card on screen while stepping through it.
    function fit(){
      if (hint.parentNode) hint.remove();
      return;
      var r = root.getBoundingClientRect(), top = 52;
      if (r.top < top - 2 || r.bottom > innerHeight + 2) window.scrollTo({top: scrollY + r.top - top, behavior: 'smooth'});
    }
    root.querySelector('[data-st="prev"]').onclick = function(){ go(i-1); fit(); };
    root.querySelector('[data-st="next"]').onclick = function(){ go(i+1); fit(); };
    list.addEventListener('scroll', fade, {passive:true});
    root.addEventListener('keydown', function(e){ if (e.key === 'ArrowLeft') go(i-1); else if (e.key === 'ArrowRight') go(i+1); });
    var x0 = null;
    root.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
    root.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) { go(dx < 0 ? i+1 : i-1); fit(); } });
    go(0);
  }

  function pageProgress(){
    var secs = [].slice.call(document.querySelectorAll('main > section[id]'));
    var names = {story:'Story', video:'Video', hand:'One Hand', songs:'Songs', close:'Closing'};
    var bar = document.createElement('div'); bar.className = 'page-progress'; bar.setAttribute('aria-hidden', 'true');
    var fill = document.createElement('span'); fill.className = 'fill'; bar.appendChild(fill);
    var dots = secs.map(function(sec){
      var a = document.createElement('a'); a.href = '#' + sec.id; a.tabIndex = -1;
      a.setAttribute('data-label', names[sec.id] || sec.id); bar.appendChild(a); return a;
    });
    document.body.appendChild(bar);
    var ticking = false;
    function update(){
      ticking = false;
      var max = document.documentElement.scrollHeight - innerHeight, y = scrollY;
      var pr = max > 0 ? Math.min(1, y / max) : 1;
      fill.style.height = (pr * 100) + '%';
      var here = -1;
      secs.forEach(function(sec, k){
        var at = max > 0 ? Math.min(1, Math.max(0, (sec.getBoundingClientRect().top + y - 60) / max)) : 0;
        dots[k].style.top = (at * 100) + '%';
        var done = pr + 0.002 >= at; dots[k].classList.toggle('done', done); if (done) here = k;
      });
      dots.forEach(function(d, k){ d.classList.toggle('here', k === here); });
    }
    function req(){ if (!ticking) { ticking = true; requestAnimationFrame(update); } }
    addEventListener('scroll', req, {passive:true}); addEventListener('resize', req);
    document.querySelectorAll('img,video').forEach(function(m){ m.addEventListener('load', req); m.addEventListener('loadedmetadata', req); });
    document.querySelectorAll('details').forEach(function(d){ d.addEventListener('toggle', req); });
    update();
  }

  // ---------- Booking pop-up ----------
  (function(){
    var dlg = document.getElementById('booking'); if (!dlg || !dlg.showModal) return;
    var START = new Date(2026,10,15), END = new Date(2027,2,22);

    var DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    function key(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth()+1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
    function nice(d){ return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
    var form = dlg.querySelector('.bk-form'), daySel = form.elements.day, done = dlg.querySelector('.bk-done'), doneMsg = dlg.querySelector('.bk-done-msg');
    var err = form.querySelector('.bk-err'), go = form.querySelector('.bk-go'), dates = {};
    (function fill(){
      var t = new Date(), today = new Date(t.getFullYear(), t.getMonth(), t.getDate()), group = null, gm = -1;
      for (var d = new Date(Math.max(START, today)); d <= END; d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1)) {
        if (d.getDay() > 4) continue;
        if (d.getMonth() !== gm) { gm = d.getMonth(); group = document.createElement('optgroup'); group.label = MONTHS[gm] + ' ' + d.getFullYear(); daySel.appendChild(group); }
        var k = key(d), o = document.createElement('option'); dates[k] = d;
        o.value = k; o.textContent = DAY[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + (SP[k] ? '  ·  ' + SP[k].join(' · ') : '');
        group.appendChild(o);
      }
    })();
    function finish(html){ form.hidden = true; done.hidden = false; doneMsg.innerHTML = html; }
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var f = form.elements, d = dates[f.day.value], slot = f.slot.value, label = (SP[f.day.value] || []).join(', ').replace(/[🕎☾] /g, '');
      if (!d) return;
      var when = nice(d) + ', ' + slot;
      var msg = "Hi Yossi! I'd like to book a 1-hour session on " + when + ' (New York time).\nName: ' + f.name.value + '\nPhone: ' + f.phone.value;
      err.hidden = true; go.disabled = true; go.textContent = 'Booking…';
      fetch('/api/book', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name:f.name.value, phone:f.phone.value, website:f.website.value, date:f.day.value, dayText:nice(d), slot:slot, label:label})})
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok || !j.ok) throw 0; }); })
        .then(function(){ finish('<b>' + when + '</b><br>Yossi will reach out to confirm. Chanukah sameach!'); })
        .catch(function(){
          err.hidden = false;
          err.innerHTML = "Couldn't send it online. <a href=\"sms:+16462610550?&body=" + encodeURIComponent(msg) + "\">Text it to Yossi</a> or <a href=\"mailto:yossifederman@gmail.com?subject=" + encodeURIComponent('Session booking: ' + when) + '&body=' + encodeURIComponent(msg) + '">email it</a>.';
        })
        .then(function(){ go.disabled = false; go.textContent = 'Book my slot'; });
    });
    function show(){ form.hidden = false; done.hidden = true; err.hidden = true; if (!dlg.open) dlg.showModal(); document.documentElement.style.overflow = 'hidden'; }
    dlg.addEventListener('close', function(){ document.documentElement.style.overflow = ''; if (location.hash === '#book') history.replaceState(null, '', location.pathname); });
    dlg.querySelector('.bk-close').onclick = function(){ dlg.close(); };
    dlg.addEventListener('click', function(e){ if (e.target !== dlg) return; var r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close(); });
    document.addEventListener('click', function(e){ var t = e.target.closest && e.target.closest('[data-book]'); if (t) { e.preventDefault(); show(); } });
    window.openBooking = show;
    if (location.hash === '#book') show();
  })();

  // ---------- One-screen page, footer pop-ups, sneak-peek locks ----------
  var locks = [].slice.call(document.querySelectorAll('[data-lock]'));
  locks.forEach(function(sec){
    var slot = sec.querySelector('.lock-slot'); if (!slot) return;
    slot.innerHTML = '<div class="lock-panel"><p class="gate-kicker">Sneak peek · Not public yet</p>' +
      '<p class="lock-title">A new presentation is coming</p>' +

      '<p class="lock-err" role="alert"></p></div>';
  });
  function openSheet(id){
    var d = document.getElementById('sheet-' + id); if (!d || !d.showModal) return;
    if (!d.open) d.showModal(); document.documentElement.style.overflow = 'hidden';
    var inp = d.querySelector('.lock-form input'); if (inp && innerWidth > 600) setTimeout(function(){ inp.focus(); }, 50);
  }
  document.querySelectorAll('dialog.sheet').forEach(function(d){
    d.querySelector('.sheet-close').onclick = function(){ d.close(); };
    d.addEventListener('click', function(e){ if (e.target !== d) return; var r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); });
    d.addEventListener('close', function(){ document.documentElement.style.overflow = ''; d.querySelectorAll('video,audio').forEach(function(m){ m.pause(); }); });

  document.addEventListener('click', function(e){ var t = e.target.closest && e.target.closest('[data-sheet]'); if (t) { e.preventDefault(); openSheet(t.getAttribute('data-sheet')); } });
  var st = document.getElementById('struggles'); if (st) struggles(st);

  function show(text){
    var parts = JSON.parse(text).parts || {};
    locks.forEach(function(sec){ var id = sec.getAttribute('data-lock'); if (parts[id] != null) { sec.innerHTML = parts[id]; sec.removeAttribute('data-lock'); } });
    var ss = document.getElementById('slideshow'); if (ss) slideshow(ss);

  document.addEventListener('submit', async function(e){
    var form = e.target; if (!form.classList || !form.classList.contains('lock-form')) return;
    e.preventDefault();
    var inp = form.querySelector('input'), go = form.querySelector('button'), err = form.parentNode.querySelector('.lock-err');
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Please open this page over https in a modern browser.'; return; }
    go.disabled = true; go.textContent = 'Opening…'; err.textContent = '';
    try { var text = await unlock(inp.value); ssSet(inp.value); show(text); }
    catch(x){ err.textContent = 'Wrong password.'; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); go.disabled = false; go.textContent = 'Unlock'; }
  });

  var saved = ssGet();
  if (saved && window.crypto && crypto.subtle) unlock(saved).then(show, function(){ ssSet(null); });
  var h = location.hash.slice(1); if (/^(story|video|songs)$/.test(h)) openSheet(h);
})();
